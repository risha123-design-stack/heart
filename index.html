<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RISA Panda</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          #f9d7e7 0%,
          #d8c4f4 48%,
          #9379c6 100%
        );

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, Helvetica, sans-serif;

      user-select: none;
      -webkit-user-select: none;

      touch-action: manipulation;
    }

    .container {
      width: 100%;
      height: 100vh;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      cursor: pointer;
    }

    /* =====================================
       BACKGROUND LIGHT
    ===================================== */

    .glow {
      position: absolute;

      width: 520px;
      height: 520px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.7),
          rgba(255, 255, 255, 0.15) 55%,
          transparent 72%
        );

      filter: blur(25px);

      pointer-events: none;
    }

    /* =====================================
       PANDA

       IMPORTANT:
       Panda itself has NO animation.
    ===================================== */

    #panda {
      position: relative;

      width: 520px;
      height: 520px;

      z-index: 10;

      transform: none;
    }

    /* =====================================
       RISA WORD
    ===================================== */

    .word {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(
          var(--x),
          var(--y)
        );

      white-space: nowrap;

      font-size: 9px;
      font-weight: 800;

      pointer-events: none;

      transition:
        opacity 0.08s linear,
        transform 0.15s ease;
    }

    /* WHITE FACE */

    .face-word {
      color: #ffffff;

      text-shadow:
        0 0 1px rgba(0, 0, 0, 0.6),
        0 0 4px rgba(255, 255, 255, 0.8);
    }

    /* BLACK PANDA PARTS */

    .dark-word {
      color: #050505;

      font-weight: 900;

      text-shadow:
        0 0 1px rgba(255, 255, 255, 0.25);
    }

    /* =====================================
       EARS

       ONLY ears resize slightly.
    ===================================== */

    .ear {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 1px;

      transform:
        translate(
          var(--ear-x),
          var(--ear-y)
        );

      transform-origin: center;

      animation:
        earMove 2.1s ease-in-out infinite;
    }

    .ear .word {
      left: 0;
      top: 0;
    }

    .left-ear {
      --ear-x: -145px;
      --ear-y: -135px;
    }

    .right-ear {
      --ear-x: 145px;
      --ear-y: -135px;

      animation-delay: 0.15s;
    }

    @keyframes earMove {

      0%,
      100% {
        transform:
          translate(
            var(--ear-x),
            var(--ear-y)
          )
          scale(1);
      }

      45% {
        transform:
          translate(
            var(--ear-x),
            var(--ear-y)
          )
          scale(1.07);
      }

      55% {
        transform:
          translate(
            var(--ear-x),
            var(--ear-y)
          )
          scale(0.97);
      }

      70% {
        transform:
          translate(
            var(--ear-x),
            var(--ear-y)
          )
          scale(1);
      }
    }

    /* =====================================
       EYES
    ===================================== */

    .eye {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 40px;
  height: 25px;

  transform: translate(-50%, -50%);

  overflow: hidden;
  border-radius: 50%;

  pointer-events: none;
}

.left-eye {
  margin-left: -70px;
  margin-top: -30px;
}

.right-eye {
  margin-left: 70px;
  margin-top: -30px;
}


/* WHITE PART OF EYE */

.pupil {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 14px;
  height: 18px;

  background: #ffffff;

  border-radius: 50%;

  transform: translate(-50%, -50%);

  z-index: 1;

  box-shadow:
    0 0 4px rgba(255, 255, 255, 0.8);
}


/* EYELID */

.eyelid {
  position: absolute;

  left: 0;
  top: -100%;

  width: 100%;
  height: 100%;

  background: #050505;

  z-index: 5;

  animation: realBlink 4s infinite;
}


/* OPEN -> CLOSE -> OPEN */

@keyframes realBlink {

  /* OPEN */
  0%,
  82% {
    top: -100%;
  }

  /* START CLOSING */
  85% {
    top: -50%;
  }

  /* COMPLETELY CLOSED */
  88%,
  91% {
    top: 0;
  }

  /* START OPENING */
  94% {
    top: -50%;
  }

  /* COMPLETELY OPEN */
  97%,
  100% {
    top: -100%;
  }
}

@keyframes blink {
  0%,
  88%,
  92%,
  100% {
    transform:
      translate(-50%, -50%)
      scaleY(1);
  }

  89%,
  91% {
    transform:
      translate(-50%, -50%)
      scaleY(0.08);
  }
}

    @keyframes blink {
  0%,
  88%,
  92%,
  100% {
    transform:
      translate(-50%, -50%)
      scaleY(1);
  }

  89%,
  91% {
    transform:
      translate(-50%, -50%)
      scaleY(0.08);
  }
}

    /* =====================================
       MOUTH
    ===================================== */

    #mouth {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 58px;
      height: 25px;

      margin-left: -29px;
      margin-top: 78px;

      pointer-events: none;

      z-index: 20;
    }

    .mouth-line {
      position: absolute;

      left: 50%;
      top: 0;

      width: 45px;
      height: 14px;

      transform:
        translateX(-50%);

      border-bottom:
        4px solid #050505;

      border-radius:
        0 0 50% 50%;
    }

    /*
       hidden mouth opening
    */

    .mouth-open {
      position: absolute;

      left: 50%;
      top: 8px;

      width: 28px;
      height: 5px;

      transform:
        translateX(-50%)
        scaleY(0);

      transform-origin: top;

      border-radius:
        0 0 50% 50%;

      background: #050505;

      opacity: 0;
    }

    /*
      voice speaking:
      mouth opens/closes repeatedly
    */

    #mouth.talking .mouth-open {
      opacity: 1;

      animation:
        talkMouth 0.18s ease-in-out infinite;
    }

    #mouth.talking .mouth-line {
      opacity: 0.35;
    }

    @keyframes talkMouth {

      0%,
      100% {
        transform:
          translateX(-50%)
          scaleY(0.2);

        height: 5px;
      }

      50% {
        transform:
          translateX(-50%)
          scaleY(1);

        height: 24px;
      }
    }

    /* =====================================
       DON'T TOUCH ME
    ===================================== */

    #dontTouch {
      position: absolute;

      left: 50%;
      top: 14%;

      width: 100%;

      transform:
        translateX(-50%)
        scale(0.8);

      text-align: center;

      color: #ffffff;

      font-size: 34px;
      font-weight: 900;

      letter-spacing: 3px;

      opacity: 0;

      pointer-events: none;

      z-index: 100;

      text-shadow:
        0 0 5px #7c3aed,
        0 0 12px #7c3aed,
        0 0 24px rgba(124, 58, 237, 0.8);

      transition:
        opacity 0.15s,
        transform 0.15s;
    }

    #dontTouch.show {
      opacity: 1;

      transform:
        translateX(-50%)
        scale(1);
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

      #panda {
        width: 350px;
        height: 350px;

        transform: scale(0.68);
      }

      /*
        Container transform above is static,
        not animated.
      */

      .glow {
        width: 330px;
        height: 330px;
      }

      #dontTouch {
        top: 11%;

        font-size: 24px;

        letter-spacing: 2px;
      }
    }
  </style>
</head>


<body>

  <div
    class="container"
    id="container"
  >

    <div class="glow"></div>

    <div id="dontTouch">
      DON'T TOUCH ME!
    </div>


    <div id="panda">

      <!-- EARS -->

      <div
        class="ear left-ear"
        id="leftEar"
      ></div>

      <div
        class="ear right-ear"
        id="rightEar"
      ></div>


      <!-- EYES -->

      <div class="eye left-eye">
  <div class="pupil"></div>
  <div class="eyelid"></div>
</div>

<div class="eye right-eye">
  <div class="pupil"></div>
  <div class="eyelid"></div>
</div>


      <!-- MOUTH -->

      <div id="mouth">

        <div class="mouth-line"></div>

        <div class="mouth-open"></div>

      </div>

    </div>

  </div>


  <script>
    let cachedVoices = [];

function loadVoices() {
  cachedVoices = window.speechSynthesis.getVoices();
}

if ("speechSynthesis" in window) {
  loadVoices();

  window.speechSynthesis.onvoiceschanged = () => {
    loadVoices();
  };
}

    const panda =
      document.getElementById(
        "panda"
      );

    const container =
      document.getElementById(
        "container"
      );

    const leftEar =
      document.getElementById(
        "leftEar"
      );

    const rightEar =
      document.getElementById(
        "rightEar"
      );

    const mouth =
      document.getElementById(
        "mouth"
      );

    const dontTouch =
      document.getElementById(
        "dontTouch"
      );


    /* =====================================
       ONLY WORD USED
    ===================================== */

    const pandaWord = "RISA";


    /* =====================================
       CREATE NORMAL PANDA WORD
    ===================================== */

    function createWord(
      x,
      y,
      type = "face",
      parent = panda
    ) {

      const span =
        document.createElement(
          "span"
        );


      span.classList.add(
        "word"
      );


      if (type === "dark") {

        span.classList.add(
          "dark-word"
        );

      } else {

        span.classList.add(
          "face-word"
        );

      }


      span.textContent =
        pandaWord;


      span.style.setProperty(
        "--x",
        x + "px"
      );

      span.style.setProperty(
        "--y",
        y + "px"
      );


      parent.appendChild(
        span
      );
    }


    /* =====================================
       CREATE FILLED ELLIPSE
    ===================================== */

    function createEllipse(
      centerX,
      centerY,
      radiusX,
      radiusY,
      count,
      type = "face",
      parent = panda
    ) {

      for (
        let i = 0;
        i < count;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI *
          2;


        const radius =
          Math.sqrt(
            Math.random()
          );


        const x =
          centerX +
          Math.cos(angle) *
          radiusX *
          radius;


        const y =
          centerY +
          Math.sin(angle) *
          radiusY *
          radius;


        createWord(
          x,
          y,
          type,
          parent
        );
      }
    }


    /* =====================================
       CREATE PANDA FACE

       Entire white head
    ===================================== */

    createEllipse(
      0,
      15,
      185,
      175,
      800,
      "face"
    );


    /* =====================================
       EARS

       Coordinates are relative
       to each ear container.
    ===================================== */

    createEllipse(
      0,
      0,
      64,
      64,
      130,
      "dark",
      leftEar
    );


    createEllipse(
      0,
      0,
      64,
      64,
      130,
      "dark",
      rightEar
    );


    /* =====================================
       BLACK EYE PATCHES
    ===================================== */

    createEllipse(
      -70,
      -30,
      55,
      42,
      115,
      "dark"
    );


    createEllipse(
      70,
      -30,
      55,
      42,
      115,
      "dark"
    );


    /* =====================================
       NOSE
    ===================================== */

    createEllipse(
      0,
      42,
      25,
      17,
      50,
      "dark"
    );


    /* =====================================
       TOUCH / CLICK
    ===================================== */

    let isTalking = false;


    container.addEventListener(
      "pointerdown",
      () => {

        /*
          Avoid many voices
          playing together.
        */

        if (isTalking) {
          return;
        }


        isTalking = true;


        /*
          Show message
        */

        dontTouch.classList.add(
          "show"
        );


        /*
          Mouth starts
          open/close animation.
        */

        

        /*
          Speak
        */

        speakDontTouch();

      }
    );


    /* =====================================
       SPEAK
    ===================================== */

    function speakDontTouch() {

  if (!("speechSynthesis" in window)) {
    stopTalking();
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      "Don't touch me!"
    );

  speech.lang = "en-US";

  speech.pitch = 1.85;

  speech.rate = 1.08;

  speech.volume = 1;


  /*
    If voices were not loaded yet,
    fetch them again immediately.
  */

  if (cachedVoices.length === 0) {
    cachedVoices =
      window.speechSynthesis.getVoices();
  }


  const preferred =
    cachedVoices.find((voice) => {

      const name =
        voice.name.toLowerCase();

      return (
        voice.lang
          .toLowerCase()
          .startsWith("en")
        &&
        (
          name.includes("zira") ||
          name.includes("aria") ||
          name.includes("samantha") ||
          name.includes("female")
        )
      );
    });


  const fallback =
    cachedVoices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith("en")
    );


  if (preferred) {
    speech.voice = preferred;
  } else if (fallback) {
    speech.voice = fallback;
  }


  speech.onstart = () => {
    mouth.classList.add("talking");
  };


  speech.onend = () => {
    stopTalking();
  };


  speech.onerror = () => {
    stopTalking();
  };


  /*
    Speak immediately on FIRST touch
  */

  window.speechSynthesis.speak(speech);


  /*
    Chrome/mobile speech sometimes
    needs a resume call.
  */

  window.speechSynthesis.resume();


  setTimeout(() => {
    if (isTalking) {
      stopTalking();
    }
  }, 2000);
}


    /* =====================================
       STOP TALKING
    ===================================== */

    function stopTalking() {

      mouth.classList.remove(
        "talking"
      );


      dontTouch.classList.remove(
        "show"
      );


      isTalking = false;
    }


    /* =====================================
       LOAD VOICES
    ===================================== */

    

  </script>

</body>
</html>
