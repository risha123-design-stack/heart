<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Love Heart</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;

      background: #000;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      height: 100vh;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    .glow {
      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      background: rgba(255, 70, 150, 0.12);

      filter: blur(80px);

      animation: glowBeat 0.9s ease-in-out infinite;
    }


    #heart {
      position: relative;

      width: 500px;
      height: 500px;

      transform-style: preserve-3d;

      z-index: 2;
    }

    

    .word {
      position: absolute;

      left: 50%;
      top: 50%;

      color: #ff87b7;

      font-size: 12px;
      font-weight: 600;

      white-space: nowrap;

      transform-origin: center;

      text-shadow:
        0 0 3px #ff4f9a,
        0 0 7px #ff4f9a,
        0 0 12px rgba(255, 79, 154, 0.9);

      animation:
        wordScatter 0.9s
        cubic-bezier(.4, 0, .2, 1)
        infinite;
    }

    

    @keyframes wordScatter {

      /*
        ORIGINAL HEART
      */

      0% {
        transform:
          translate3d(
            var(--x),
            var(--y),
            var(--z)
          )
          scale(1);

        opacity: 0.85;
      }


      /*
        Original shape
        little pause
      */

      18% {
        transform:
          translate3d(
            var(--x),
            var(--y),
            var(--z)
          )
          scale(1);

        opacity: 0.9;
      }


      /*
        FIRST PUSH
      */

      30% {
        transform:
          translate3d(
            calc(var(--x) + var(--scatter-x1)),
            calc(var(--y) + var(--scatter-y1)),
            var(--z)
          )
          scale(1.05);

        opacity: 1;
      }


      /*
        BIGGEST SCATTER

        Heart looks bigger here
        because WORDS move outward.
      */

      42% {
        transform:
          translate3d(
            calc(var(--x) + var(--scatter-x2)),
            calc(var(--y) + var(--scatter-y2)),
            var(--z)
          )
          scale(1.12);

        opacity: 1;
      }


      /*
        QUICK RETURN
      */

      56% {
        transform:
          translate3d(
            calc(var(--x) + var(--scatter-x1)),
            calc(var(--y) + var(--scatter-y1)),
            var(--z)
          )
          scale(1.04);

        opacity: 1;
      }


      /*
        BACK TO HEART
      */

      68% {
        transform:
          translate3d(
            var(--x),
            var(--y),
            var(--z)
          )
          scale(1);

        opacity: 0.9;
      }


      100% {
        transform:
          translate3d(
            var(--x),
            var(--y),
            var(--z)
          )
          scale(1);

        opacity: 0.85;
      }
    }


    /* =============================
       CENTER TEXT
    ============================== */

    .center-text {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -45%);

      color: white;

      font-size: 20px;
      letter-spacing: 4px;

      z-index: 5;

      text-shadow:
        0 0 8px #ff4f9a,
        0 0 16px #ff4f9a;

      animation: centerBeat 0.9s ease-in-out infinite;
    }


    @keyframes centerBeat {

      0%,
      100% {
        transform:
          translate(-50%, -45%)
          scale(1);

        opacity: 0.6;
      }

      42% {
        transform:
          translate(-50%, -45%)
          scale(1.12);

        opacity: 1;
      }
    }


    @keyframes glowBeat {

      0%,
      100% {
        transform: scale(0.85);
        opacity: 0.35;
      }

      42% {
        transform: scale(1.15);
        opacity: 0.75;
      }
    }


    
    @media (max-width: 600px) {

      #heart {
        width: 340px;
        height: 340px;
      }

      .word {
        font-size: 8px;
      }

      .center-text {
        font-size: 14px;
        letter-spacing: 3px;
      }

      .glow {
        width: 300px;
        height: 300px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="glow"></div>

    <div id="heart"></div>

    <div class="center-text">
      
    </div>

  </div>


  <script>

    const heart =
      document.getElementById("heart");


   

    const heartText =
      "Risa";

    const totalWords =
      700;


   

    const heartScale =
      window.innerWidth <= 600
        ? 8
        : 12;


    

    for (
      let i = 0;
      i < totalWords;
      i++
    ) {

      const word =
        document.createElement("span");

      word.classList.add("word");

      word.textContent =
        heartText;


      

      const t =
        Math.random() *
        Math.PI *
        2;


      

      const x =
        16 *
        Math.pow(
          Math.sin(t),
          3
        );


      const y =
        13 * Math.cos(t)
        -
        5 * Math.cos(2 * t)
        -
        2 * Math.cos(3 * t)
        -
        Math.cos(4 * t);


     

      const fill =
        Math.sqrt(
          Math.random()
        );


      const posX =
        x *
        heartScale *
        fill;


      const posY =
        -y *
        heartScale *
        fill;



      const randomX =
        (
          Math.random() - 0.5
        ) * 8;


      const randomY =
        (
          Math.random() - 0.5
        ) * 8;


      const finalX =
        posX + randomX;


      const finalY =
        posY + randomY;


      

      const z =
        (
          Math.random() - 0.5
        ) * 25;


     
      const distance =
        Math.sqrt(
          finalX * finalX +
          finalY * finalY
        ) || 1;


      

      const directionX =
        finalX / distance;


      const directionY =
        finalY / distance;


     

      const scatter1 =
        18 +
        Math.random() * 15;


      

      const scatter2 =
        38 +
        Math.random() * 28;


      const scatterX1 =
        directionX *
        scatter1;


      const scatterY1 =
        directionY *
        scatter1;


      const scatterX2 =
        directionX *
        scatter2;


      const scatterY2 =
        directionY *
        scatter2;


      

      word.style.setProperty(
        "--x",
        finalX + "px"
      );


      word.style.setProperty(
        "--y",
        finalY + "px"
      );


      word.style.setProperty(
        "--z",
        z + "px"
      );


      word.style.setProperty(
        "--scatter-x1",
        scatterX1 + "px"
      );


      word.style.setProperty(
        "--scatter-y1",
        scatterY1 + "px"
      );


      word.style.setProperty(
        "--scatter-x2",
        scatterX2 + "px"
      );


      word.style.setProperty(
        "--scatter-y2",
        scatterY2 + "px"
      );


     

      word.style.opacity =
        (
          0.5 +
          Math.random() * 0.5
        );


  


      heart.appendChild(word);
    }

  </script>

</body>
</html>
